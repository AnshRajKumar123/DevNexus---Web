<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Standard Meta Tags -->
    <title>DevNexus | Team Dashboard</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description"
        content="Centralized team management dashboard for DevNexus. Manage tasks, quick links, and connected apps including WhatsApp, Instagram, Gmail, and Calendar." />
    <meta name="keywords" content="DevNexus, Team Dashboard, Task Management, API Integration" />

    <!-- PWA Manifest & Standalone Mode -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevNexus" />

    <!-- Favicon (Website Logo) -->
    <link rel="icon" type="image/png" href="/WebLogo.png" />
    <link rel="apple-touch-icon" href="/WebLogo.png" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp (Website Banner) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teamdashboard-bice.vercel.app/" />
    <meta property="og:title" content="DevNexus | Team Dashboard" />
    <meta property="og:description"
        content="Centralized team management dashboard for DevNexus. Connect apps, manage links, and track tasks." />
    <meta property="og:image" content="https://teamdashboard-bice.vercel.app/WebsiteBanner.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://teamdashboard-bice.vercel.app/" />
    <meta property="twitter:title" content="DevNexus | Team Dashboard" />
    <meta property="twitter:description"
        content="Centralized team management dashboard for DevNexus. Connect apps, manage links, and track tasks." />
    <meta property="twitter:image" content="https://teamdashboard-bice.vercel.app/WebsiteBanner.png" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for Standalone PWA & Firebase Notifications -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(() => {});
            });
        }
    </script>
</body>

</html>
